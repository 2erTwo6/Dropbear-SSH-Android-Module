name: Build and Package

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Checkout Dropbear source
        uses: actions/checkout@v4
        with:
          repository: mkj/dropbear
          path: dropbear-upstream

      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq make patch

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          check-latest: true

      - name: Cache Android NDK r29
        id: cache-ndk
        uses: actions/cache@v4
        with:
          path: ~/ndk
          key: ndk-r29-${{ runner.os }}-v1

      - name: Download Android NDK r29
        if: steps.cache-ndk.outputs.cache-hit != 'true'
        run: |
          rm -rf ~/ndk
          mkdir -p ~/ndk
          curl -L --fail --retry 5 --connect-timeout 30 -o ~/ndk/android-ndk.zip \
            https://dl.google.com/android/repository/android-ndk-r29-linux.zip
          unzip -q ~/ndk/android-ndk.zip -d ~/ndk
          rm -f ~/ndk/android-ndk.zip

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: go-sftp-${{ hashFiles('sftp-server/go.mod') }}

      - name: Build
        run: |
          export ANDROID_NDK_HOME="$HOME/ndk/android-ndk-r29"
          export DROPBEAR_SOURCE="$GITHUB_WORKSPACE/dropbear-upstream"
          bash build.sh

      - name: Package
        env:
          DROPBEAR_SOURCE: ${{ github.workspace }}/dropbear-upstream
        run: bash package.sh

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: module-zip
          path: dropbear-ksu-v*.zip
          if-no-files-found: error

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dropbear-ksu-v*.zip
          generate_release_notes: true
