name: CI

on:
  push:
    branches: [main]
    tags: ['v*', '[0-9]*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DROPBEAR_REVISION: e470317914be7f78791baed62b17578b1c934742

jobs:
  build:
    name: Build, test, and package
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          check-latest: true

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: go-sftp-${{ runner.os }}-${{ hashFiles('sftp-server/go.mod') }}
          restore-keys: |
            go-sftp-${{ runner.os }}-

      - name: Install build and test tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq make patch unzip zip openssh-client curl ca-certificates file

      - name: Syntax-check shell scripts
        run: |
          for script in build.sh package.sh module/*.sh tests/*.sh; do
            sh -n "$script"
            echo "syntax ok: $script"
          done

      - name: Build host sftp-server and test fixture
        run: |
          mkdir -p build/sftp-test-root
          cp README.md build/sftp-test-root/README.md
          cd sftp-server
          GOFLAGS=-mod=mod CGO_ENABLED=0 go build -trimpath \
            -ldflags='-s -w -buildid=' \
            -o "$GITHUB_WORKSPACE/build/test-sftp-server" .

      - name: Run SFTP protocol smoke test
        run: |
          rm -f /tmp/dropbear-ksu-sftp-test-README.md
          sftp -S "$GITHUB_WORKSPACE/tests/fake-ssh.sh" -b tests/sftp.batch host.invalid
          test -f /tmp/dropbear-ksu-sftp-test-README.md

      - name: Checkout Dropbear source
        uses: actions/checkout@v4
        with:
          repository: mkj/dropbear
          ref: ${{ env.DROPBEAR_REVISION }}
          path: dropbear-upstream
          fetch-depth: 0

      - name: Cache Android NDK r29
        id: cache-ndk
        uses: actions/cache@v4
        with:
          path: ~/ndk/android-ndk-r29
          key: android-ndk-r29-${{ runner.os }}-${{ runner.arch }}-v1

      - name: Download Android NDK r29
        if: steps.cache-ndk.outputs.cache-hit != 'true'
        run: |
          TMP_NDK="$HOME/ndk/.tmp-android-ndk-r29"
          mkdir -p "$HOME/ndk"
          rm -rf "$TMP_NDK" "$HOME/ndk/android-ndk-r29"
          mkdir -p "$TMP_NDK"
          curl -L --fail --retry 5 --connect-timeout 30 \
            -o "$TMP_NDK/android-ndk.zip" \
            https://dl.google.com/android/repository/android-ndk-r29-linux.zip
          unzip -q "$TMP_NDK/android-ndk.zip" -d "$TMP_NDK"
          rm -f "$TMP_NDK/android-ndk.zip"
          test -x "$TMP_NDK/android-ndk-r29/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android23-clang"
          mv "$TMP_NDK/android-ndk-r29" "$HOME/ndk/android-ndk-r29"
          rm -rf "$TMP_NDK"

      - name: Verify NDK toolchain
        run: |
          test -x "$HOME/ndk/android-ndk-r29/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android23-clang"

      - name: Build Dropbear and sftp-server
        run: |
          export ANDROID_NDK_HOME="$HOME/ndk/android-ndk-r29"
          export DROPBEAR_SOURCE="$GITHUB_WORKSPACE/dropbear-upstream"
          export GOFLAGS=-mod=mod
          bash build.sh

      - name: Verify built binaries
        run: |
          for binary in dropbear dropbearkey dropbearconvert scp sftp-server; do
            test -s "build/out/$binary"
            echo "built: $binary"
          done
          file build/out/*

      - name: Package module ZIP
        id: package
        run: |
          export DROPBEAR_SOURCE="$GITHUB_WORKSPACE/dropbear-upstream"
          bash package.sh
          ZIP_FILE=$(ls -1 dropbear-ksu-v*.zip | head -n1)
          unzip -t "$ZIP_FILE"
          if [ "${GITHUB_REF_TYPE:-}" = tag ]; then
            EXPECTED_ZIP="dropbear-ksu-v${GITHUB_REF_NAME#v}-arm64.zip"
            if [ "$ZIP_FILE" != "$EXPECTED_ZIP" ]; then
              echo "Expected $EXPECTED_ZIP, but package.sh produced $ZIP_FILE" >&2
              exit 1
            fi
          fi
          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"
          echo "artifact_name=${ZIP_FILE%.zip}" >> "$GITHUB_OUTPUT"

      - name: Upload module ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: ${{ steps.package.outputs.zip_file }}
          if-no-files-found: error
          compression-level: 0

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dropbear-ksu-v*.zip
          generate_release_notes: true
